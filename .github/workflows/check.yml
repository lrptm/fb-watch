name: Check /sp/ for football threads

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check for new football threads
        run: python fb_watch.py

      - name: Commit and push if changed
        run: |
          git config user.name "fb-watch"
          git config user.email "fb-watch@users.noreply.github.com"
          git add seen.json fb_feed.xml
          git diff --cached --quiet || git commit -m "Update RSS feed [skip ci]"
          git push
